<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CSH7D3F7VV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-CSH7D3F7VV');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Estimate gaming FPS from your CPU, GPU, game, resolution, graphics settings and rendering options.">
  <link rel="canonical" href="https://systemfitpc.vercel.app/fps-calculator.html">
  <title>FPS Calculator | SystemFit PC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#070a11;
      --bg2:#0b1020;
      --panel:rgba(15,21,35,.86);
      --panel2:rgba(10,15,27,.92);
      --panel3:#11192a;
      --border:rgba(158,178,214,.16);
      --border2:rgba(130,111,255,.28);
      --text:#f6f8ff;
      --muted:#a6b2c7;
      --dim:#718099;
      --purple:#765cff;
      --purple2:#9c88ff;
      --cyan:#5bc8ff;
      --green:#54e59a;
      --yellow:#ffc56e;
      --red:#ff7180;
      --shadow:0 26px 90px rgba(0,0,0,.34);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      color:var(--text);
      background:
        radial-gradient(circle at 10% -5%,rgba(116,83,255,.20),transparent 30%),
        radial-gradient(circle at 90% 15%,rgba(33,161,229,.13),transparent 30%),
        linear-gradient(180deg,#070a11 0%,#080c15 45%,#070a11 100%);
      font-family:"DM Sans",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    body:before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:-1;
      background:
        linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
      background-size:52px 52px;
      mask-image:linear-gradient(to bottom,rgba(0,0,0,.5),transparent 70%);
    }
    a{color:inherit}
    button,input,select{font:inherit}
    button{cursor:pointer}
    :focus-visible{outline:2px solid #a797ff;outline-offset:3px}

    .wrap{max-width:1220px;margin:auto;padding:34px 22px 70px}

    .hero{
      position:relative;
      overflow:hidden;
      border:1px solid var(--border);
      border-radius:26px;
      padding:clamp(25px,5vw,54px);
      background:
        radial-gradient(circle at 85% 25%,rgba(80,191,255,.12),transparent 27%),
        radial-gradient(circle at 15% 0%,rgba(118,92,255,.20),transparent 35%),
        linear-gradient(145deg,rgba(20,28,47,.94),rgba(9,14,25,.94));
      box-shadow:var(--shadow);
    }
    .hero:after{
      content:"";
      position:absolute;
      width:360px;height:360px;
      right:-130px;bottom:-220px;
      border-radius:50%;
      border:1px solid rgba(113,203,255,.18);
      box-shadow:0 0 0 40px rgba(113,203,255,.025),0 0 0 80px rgba(113,203,255,.015);
    }
    .eyebrow{
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding:7px 11px;
      border:1px solid rgba(143,126,255,.28);
      border-radius:999px;
      color:#c2b8ff;
      background:rgba(118,92,255,.09);
      font-size:10px;
      font-weight:800;
      letter-spacing:.12em;
    }
    .eyebrow i{
      width:7px;height:7px;border-radius:50%;
      background:var(--green);
      box-shadow:0 0 12px rgba(84,229,154,.8);
    }
    h1{
      position:relative;
      z-index:1;
      max-width:820px;
      margin:17px 0 13px;
      font:700 clamp(36px,6vw,66px)/1 "Space Grotesk",sans-serif;
      letter-spacing:-.055em;
    }
    .hero h1 span{
      background:linear-gradient(105deg,#fff 15%,#b6a8ff 55%,#66d1ff);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }
    .hero-copy{
      position:relative;z-index:1;
      max-width:760px;
      margin:0;
      color:#aebbd0;
      font-size:15px;
      line-height:1.75;
    }
    .hero-stats{
      position:relative;z-index:1;
      display:flex;
      flex-wrap:wrap;
      gap:9px;
      margin-top:25px;
    }
    .hero-stat{
      padding:9px 12px;
      border:1px solid rgba(158,178,214,.14);
      border-radius:10px;
      background:rgba(255,255,255,.035);
      color:#c9d3e4;
      font-size:11px;
    }
    .hero-stat b{color:#fff}

    .calculator{
      margin-top:18px;
      display:grid;
      grid-template-columns:minmax(0,1.08fr) minmax(390px,.92fr);
      gap:18px;
      align-items:start;
    }
    .card{
      border:1px solid var(--border);
      border-radius:20px;
      background:linear-gradient(145deg,rgba(18,26,43,.91),rgba(9,14,25,.94));
      box-shadow:0 18px 65px rgba(0,0,0,.20);
    }
    .controls{padding:24px}
    .card-heading{
      display:flex;
      justify-content:space-between;
      gap:15px;
      align-items:flex-start;
      margin-bottom:20px;
    }
    .card-heading h2{
      margin:0;
      font:700 22px/1.15 "Space Grotesk",sans-serif;
      letter-spacing:-.035em;
    }
    .card-heading p{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.5}
    .live-dot{
      flex:none;
      display:inline-flex;align-items:center;gap:7px;
      color:#92a0b8;font-size:10px;font-weight:700;
      text-transform:uppercase;letter-spacing:.08em;
    }
    .live-dot i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(84,229,154,.8)}

    .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
    .field{min-width:0}
    .field.full{grid-column:1/-1}
    label{
      display:flex;
      justify-content:space-between;
      gap:8px;
      margin-bottom:8px;
      color:#dbe2ef;
      font-size:12px;
      font-weight:800;
    }
    label span{color:var(--dim);font-size:10px;font-weight:600}
    select,input{
      width:100%;
      height:48px;
      color:#f4f7ff;
      background:rgba(5,9,17,.78);
      border:1px solid rgba(157,176,211,.19);
      border-radius:11px;
      padding:0 13px;
      outline:none;
      transition:border-color .18s,box-shadow .18s,background .18s;
    }
    select:hover,input:hover{border-color:rgba(145,125,255,.42)}
    select:invalid{color:#74829a}
    select:focus,input:focus{
      border-color:#8c79ff;
      box-shadow:0 0 0 3px rgba(118,92,255,.13);
      background:#0b1120;
    }
    .game-picker{position:relative}
    .game-picker-trigger{
      width:100%;
      min-height:58px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:10px 13px;
      text-align:left;
      color:#f4f7ff;
      background:rgba(5,9,17,.78);
      border:1px solid rgba(157,176,211,.19);
      border-radius:11px;
      transition:border-color .18s,box-shadow .18s,background .18s;
    }
    .game-picker-trigger:hover,.game-picker.open .game-picker-trigger{
      border-color:rgba(145,125,255,.50);
      background:#0b1120;
    }
    .game-picker-trigger small{
      display:block;
      color:#74829a;
      font-size:8px;
      font-weight:900;
      letter-spacing:.10em;
    }
    .game-picker-trigger strong{
      display:block;
      margin-top:4px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:13px;
    }
    .picker-chevron{
      color:#9e8cff;
      font-size:18px;
      line-height:1;
      transition:transform .18s;
    }
    .game-picker.open .picker-chevron{transform:rotate(180deg)}
    .game-picker-menu{
      position:absolute;
      z-index:100;
      left:0;
      right:0;
      top:calc(100% + 8px);
      display:none;
      padding:10px;
      border:1px solid rgba(157,176,211,.20);
      border-radius:15px;
      background:rgba(10,16,28,.98);
      box-shadow:0 24px 70px rgba(0,0,0,.50);
      backdrop-filter:blur(20px);
    }
    .game-picker.open .game-picker-menu{display:block}
    .game-picker-search{position:relative}
    .game-picker-search input{padding-right:40px}
    .game-picker-count{
      padding:8px 4px 7px;
      color:#718099;
      font-size:9px;
      font-weight:800;
    }
    .game-picker-list{
      max-height:310px;
      overflow:auto;
      display:grid;
      gap:4px;
      padding-right:2px;
    }
    .game-picker-option{
      width:100%;
      min-height:40px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:8px 10px;
      border:1px solid transparent;
      border-radius:9px;
      text-align:left;
      color:#b9c5d8;
      background:rgba(255,255,255,.025);
    }
    .game-picker-option:hover,.game-picker-option.selected{
      color:#fff;
      background:rgba(118,92,255,.12);
      border-color:rgba(145,125,255,.22);
    }
    .game-picker-option b{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:10px;
    }
    .game-picker-option small{
      flex:none;
      color:#6f7d94;
      font-size:8px;
    }
    .game-picker-empty{
      padding:24px 10px;
      text-align:center;
      color:#74829a;
      font-size:10px;
    }

    .game-search{
      position:relative;
    }
    .game-search input{padding-right:40px}
    .search-icon{
      position:absolute;right:13px;top:50%;transform:translateY(-50%);
      color:#7d8aa1;font-size:16px;pointer-events:none;
    }
    .hint{margin-top:6px;color:#728097;font-size:10px;line-height:1.4}

    .chip-group{display:flex;flex-wrap:wrap;gap:7px}
    .chip{
      min-width:76px;
      height:38px;
      padding:0 12px;
      border:1px solid rgba(157,176,211,.15);
      border-radius:10px;
      color:#aebbd0;
      background:rgba(255,255,255,.035);
      font-size:11px;
      font-weight:800;
      transition:.18s;
    }
    .chip:hover{border-color:rgba(145,125,255,.42);color:#fff}
    .chip.active{
      border-color:rgba(145,125,255,.55);
      color:#fff;
      background:linear-gradient(135deg,rgba(118,92,255,.25),rgba(72,193,255,.08));
      box-shadow:inset 0 0 20px rgba(118,92,255,.08);
    }

    .toggle-row{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }
    .toggle{
      position:relative;
      min-height:52px;
      padding:9px 10px;
      text-align:left;
      border:1px solid rgba(157,176,211,.15);
      border-radius:11px;
      color:#aebbd0;
      background:rgba(255,255,255,.035);
      transition:.18s;
    }
    .toggle b{display:block;color:#dfe6f2;font-size:11px}
    .toggle small{display:block;margin-top:3px;color:#718099;font-size:9px}
    .toggle.active{
      border-color:rgba(145,125,255,.45);
      background:rgba(118,92,255,.12);
    }
    .toggle.active:after{
      content:"ON";
      position:absolute;top:8px;right:8px;
      color:#72e6af;font-size:8px;font-weight:900;
    }

    .calculate:disabled{
  opacity:.45;
  cursor:not-allowed;
  filter:grayscale(.3);
}
.calculate{
      width:100%;
      height:54px;
      margin-top:18px;
      border:0;
      border-radius:12px;
      color:#fff;
      background:linear-gradient(105deg,#765cff,#634be0 55%,#3aaee8);
      box-shadow:0 15px 32px rgba(93,75,221,.22);
      font-weight:900;
      letter-spacing:.01em;
      transition:transform .18s,filter .18s;
    }
    .calculate:hover{transform:translateY(-1px);filter:brightness(1.09)}
    .calculate:active{transform:translateY(0)}

    /* Results */
    .results{
      padding:22px;
      position:sticky;
      top:92px;
    }
    .result-top{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
      padding-bottom:17px;
      border-bottom:1px solid rgba(157,176,211,.12);
    }
    .result-kicker{
      color:#7f8da5;
      font-size:9px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .result-game{
      margin-top:5px;
      font:700 18px/1.25 "Space Grotesk",sans-serif;
      letter-spacing:-.025em;
    }
    .estimate-badge{
      flex:none;
      padding:7px 9px;
      border-radius:8px;
      color:#c9c0ff;
      background:rgba(118,92,255,.10);
      border:1px solid rgba(145,125,255,.22);
      font-size:9px;
      font-weight:900;
      letter-spacing:.08em;
    }

    .score-row{
      display:grid;
      grid-template-columns:126px 1fr;
      gap:18px;
      align-items:center;
      margin:20px 0;
    }
    .score-ring{
      --score:72;
      width:118px;height:118px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:conic-gradient(var(--purple) calc(var(--score)*1%),rgba(132,151,185,.12) 0);
      position:relative;
    }
    .score-ring:before{
      content:"";
      position:absolute;
      inset:8px;
      border-radius:50%;
      background:#0b111d;
      border:1px solid rgba(157,176,211,.12);
    }
    .score-inner{position:relative;text-align:center}
    .score-num{font:700 34px/1 "Space Grotesk",sans-serif}
    .score-label{margin-top:5px;color:#75839b;font-size:8px;font-weight:900;letter-spacing:.1em}
    .score-copy h3{margin:0;font:700 17px "Space Grotesk",sans-serif}
    .score-copy p{margin:7px 0 0;color:#98a6bc;font-size:11px;line-height:1.55}
    .performance-tag{
      display:inline-flex;
      margin-top:10px;
      padding:5px 8px;
      border-radius:7px;
      background:rgba(84,229,154,.08);
      border:1px solid rgba(84,229,154,.16);
      color:#75e6af;
      font-size:9px;
      font-weight:900;
    }

    .fps-hero{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
      margin-bottom:10px;
    }
    .fps-box{
      padding:15px;
      border-radius:13px;
      background:linear-gradient(145deg,rgba(23,34,55,.86),rgba(12,19,32,.9));
      border:1px solid rgba(157,176,211,.13);
    }
    .fps-box.primary{border-top:2px solid var(--cyan)}
    .fps-box.low{border-top:2px solid var(--purple2)}
    .fps-box small{display:block;color:#7e8ca4;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
    .fps-box strong{display:block;margin-top:6px;font:700 29px/1 "Space Grotesk",sans-serif}
    .fps-box span{display:block;margin-top:4px;color:#77859d;font-size:9px}

    .fg-breakdown{
      margin:0 0 10px;
      padding:12px;
      border:1px solid rgba(91,200,255,.14);
      border-radius:12px;
      background:linear-gradient(145deg,rgba(24,42,59,.52),rgba(10,17,29,.68));
    }
    .fg-breakdown[hidden]{display:none}
    .fg-breakdown-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }
    .fg-breakdown-head b{
      display:block;
      color:#dcecff;
      font-size:10px;
    }
    .fg-breakdown-head span{
      display:block;
      margin-top:4px;
      color:#73849b;
      font-size:8px;
      line-height:1.45;
    }
    .fg-breakdown-head em{
      flex:none;
      padding:4px 6px;
      border-radius:6px;
      border:1px solid rgba(91,200,255,.18);
      background:rgba(91,200,255,.06);
      color:#7fd7ff;
      font-size:7px;
      font-style:normal;
      font-weight:900;
      letter-spacing:.08em;
    }
    .fg-breakdown-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:9px;
    }
    .fg-breakdown-grid > div{
      padding:9px 10px;
      border-radius:9px;
      background:rgba(255,255,255,.022);
      border:1px solid rgba(157,176,211,.08);
    }
    .fg-breakdown-grid small{
      display:block;
      color:#71829a;
      font-size:8px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.07em;
    }
    .fg-breakdown-grid strong{
      display:block;
      margin-top:4px;
      color:#eef5ff;
      font:700 17px/1 "Space Grotesk",sans-serif;
    }

    .metrics{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      margin-top:10px;
    }
    .metric{
      padding:11px;
      border:1px solid rgba(157,176,211,.11);
      border-radius:11px;
      background:rgba(255,255,255,.025);
    }
    .metric small{display:block;color:#75839b;font-size:8px;text-transform:uppercase;letter-spacing:.08em}
    .metric strong{display:block;margin-top:5px;color:#eaf0fa;font-size:12px;line-height:1.25}

    .balance{
      margin-top:10px;
      padding:14px;
      border:1px solid rgba(157,176,211,.11);
      border-radius:13px;
      background:rgba(255,255,255,.025);
    }
    .balance-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:13px}
    .balance-head h3{margin:0;font-size:11px}
    .balance-head span{color:#7e8ca4;font-size:9px}
    .balance-row{margin:10px 0}
    .balance-label{display:flex;justify-content:space-between;margin-bottom:5px;color:#98a6bc;font-size:9px}
    .bar{height:7px;border-radius:99px;overflow:hidden;background:rgba(142,160,191,.12)}
    .fill{height:100%;border-radius:99px;transition:width .45s ease}
    .fill.cpu{background:linear-gradient(90deg,#7a5df1,#b296ff)}
    .fill.gpu{background:linear-gradient(90deg,#329fd2,#71d7ff)}
    .fill.vram{background:linear-gradient(90deg,#d89a43,#ffd27d)}

    .result-note{
      margin:11px 0 0;
      padding:10px 11px;
      color:#77869e;
      border:1px solid rgba(157,176,211,.10);
      border-radius:10px;
      background:rgba(255,255,255,.02);
      font-size:9px;
      line-height:1.6;
    }

    /* Library */
    /* Gaming-focused lower sections */
    .library{
      position:relative;
      margin-top:22px;
      padding:28px 25px 24px;
      overflow:hidden;
      border-color:rgba(137,119,255,.20);
      background:
        radial-gradient(circle at 92% 8%, rgba(123,93,255,.13), transparent 27%),
        radial-gradient(circle at 8% 100%, rgba(37,190,255,.055), transparent 25%),
        linear-gradient(145deg, rgba(15,21,35,.98), rgba(8,13,23,.98));
      box-shadow:0 18px 55px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.025);
    }
    .library::before{
      content:"";
      position:absolute;
      top:0;left:8%;right:8%;
      height:1px;
      background:linear-gradient(90deg, transparent, rgba(145,125,255,.7), rgba(54,201,255,.55), transparent);
      opacity:.8;
    }
    .library::after{
      content:"";
      position:absolute;
      width:180px;height:180px;
      right:-90px;bottom:-105px;
      border:1px solid rgba(139,121,255,.10);
      border-radius:50%;
      box-shadow:0 0 0 24px rgba(139,121,255,.025),0 0 0 48px rgba(139,121,255,.018);
      pointer-events:none;
    }
    .library-head{
      position:relative;
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:20px;
      margin-bottom:19px;
      z-index:1;
    }
    .library-head h2{
      margin:0;
      font:700 25px "Space Grotesk",sans-serif;
      letter-spacing:-.035em;
      color:#f4f7ff;
      text-shadow:0 0 22px rgba(139,121,255,.13);
    }
    .library-head p{margin:6px 0 0;color:#91a0ba;font-size:11px}
    .count-badge{
      flex:none;
      padding:8px 11px;
      border-radius:9px;
      color:#d9d3ff;
      background:linear-gradient(135deg,rgba(139,121,255,.14),rgba(65,184,255,.06));
      border:1px solid rgba(139,121,255,.25);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 6px 20px rgba(0,0,0,.16);
      font-size:10px;font-weight:800;
    }
    .library-tools{
      position:relative;
      display:grid;
      grid-template-columns:minmax(220px,1fr) auto;
      gap:9px;
      margin-bottom:14px;
      z-index:2;
    }
    .category-tabs{display:flex;flex-wrap:wrap;gap:7px}
    .category{
      height:34px;
      padding:0 11px;
      border:1px solid rgba(157,176,211,.13);
      border-radius:9px;
      color:#91a0b9;
      background:rgba(255,255,255,.025);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
      font-size:9px;font-weight:800;

function setupHardwarePicker(selectId, searchId, items, placeholder){
  const picker = document.getElementById(selectId + "Picker");
  const trigger = document.getElementById(selectId + "Trigger");
  const label = document.getElementById(selectId + "Label");
  const menu = document.getElementById(selectId + "Menu");
  const search = document.getElementById(searchId);
  const options = document.getElementById(selectId + "Options");
  const select = document.getElementById(selectId);
  if(!picker || !trigger || !label || !menu || !search || !options || !select) return;

  function render(query=""){
    const q = query.trim().toLowerCase();
    options.innerHTML = "";
    let count = 0;

    items.forEach((item,index)=>{
      const haystack = [
        item.name,item.vendor,item.family,item.generation,item.tier
      ].filter(Boolean).join(" ").toLowerCase();
      if(q && !haystack.includes(q)) return;

      const button = document.createElement("button");
      button.type = "button";
      button.className = "hardware-picker-option";
      button.textContent = item.name;
      button.setAttribute("role","option");
      button.setAttribute("aria-selected", String(String(select.value) === String(index)));
      button.addEventListener("click", ()=>{
        select.value = String(index);
        select.dispatchEvent(new Event("change",{bubbles:true}));
        label.textContent = item.name;
        close();
      });
      options.appendChild(button);
      count++;
    });

    if(!count){
      const empty = document.createElement("div");
      empty.className = "hardware-picker-empty";
      empty.textContent = "No matching hardware found.";
      options.appendChild(empty);
    }
  }

  function open(){
    document.querySelectorAll(".hardware-picker.is-open").forEach(other=>{
      if(other !== picker) other.classList.remove("is-open");
    });
    picker.classList.add("is-open");
    trigger.setAttribute("aria-expanded","true");
    search.value = "";
    render();
    requestAnimationFrame(()=>search.focus());
  }

  function close(){
    picker.classList.remove("is-open");
    trigger.setAttribute("aria-expanded","false");
  }

  trigger.addEventListener("click",()=>{
    picker.classList.contains("is-open") ? close() : open();
  });

  search.addEventListener("input",()=>render(search.value));

  select.addEventListener("change",()=>{
    const index = Number(select.value);
    if(Number.isInteger(index) && items[index]) label.textContent = items[index].name;
    else label.textContent = placeholder;
    render(search.value);
  });

  document.addEventListener("click",(event)=>{
    if(!picker.contains(event.target)) close();
  });

  document.addEventListener("keydown",(event)=>{
    if(event.key === "Escape" && picker.classList.contains("is-open")){
      close();
      trigger.focus();
    }
  });

  render();
}

      const filtered = UNIQUE_GAMES.filter(g => !q || g.name.toLowerCase().includes(q));
      const list = $("gamePickerList");
      list.innerHTML = "";
      $("gameCountLabel").textContent = `${filtered.length} game${filtered.length === 1 ? "" : "s"}`;

      if (!filtered.length){
        list.innerHTML = '<div class="game-picker-empty">No games match your search.</div>';
        return;
      }

      filtered.forEach(g=>{
        const index = UNIQUE_GAMES.indexOf(g);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "game-picker-option" + (index === selected ? " selected" : "");
        btn.setAttribute("role","option");
        btn.setAttribute("aria-selected",String(index === selected));
        btn.innerHTML = `<b>${g.name}</b><small>${g.cat}</small>`;
        btn.addEventListener("click",()=>{
          $("game").value = String(index);
          $("selectedGameLabel").textContent = g.name;
          $("gameSearch").value = "";
          renderGamePicker();
          closeGamePicker();
          handleOptionChange();
        });
        list.appendChild(btn);
      });
    }

    function openGamePicker(){
      $("gamePicker").classList.add("open");
      $("gamePickerTrigger").setAttribute("aria-expanded","true");
      renderGamePicker();
      setTimeout(()=>$("gameSearch").focus(),0);
    }

    function closeGamePicker(){
      $("gamePicker").classList.remove("open");
      $("gamePickerTrigger").setAttribute("aria-expanded","false");
    }

    $("gamePickerTrigger").addEventListener("click",()=>{
      $("gamePicker").classList.contains("open") ? closeGamePicker() : openGamePicker();
    });
    $("gameSearch").addEventListener("input",renderGamePicker);
    document.addEventListener("click",(event)=>{
      if (!$("gamePicker").contains(event.target)) closeGamePicker();
    });
    document.addEventListener("keydown",(event)=>{
      if(event.key === "Escape") closeGamePicker();
    });

    function activateChips(containerId, key){
      document.querySelectorAll("#"+containerId+" .chip").forEach(btn=>{
        btn.addEventListener("click",()=>{
          document.querySelectorAll("#"+containerId+" .chip").forEach(x=>x.classList.remove("active"));
          btn.classList.add("active");
          state[key] = key === "resolution" ? Number(btn.dataset.value) : btn.dataset.value;
          handleOptionChange();
        });
      });
    }

    activateChips("resolutionChips","resolution");
    activateChips("presetChips","preset");

    ["upscaling","rt","fg"].forEach(key=>{
      const id = key === "upscaling" ? "upscalingToggle" : key === "rt" ? "rtToggle" : "fgToggle";
      $(id).addEventListener("click",()=>{
        state[key] = !state[key];
        $(id).classList.toggle("active",state[key]);
        $(id).setAttribute("aria-pressed",String(state[key]));
        handleOptionChange();
      });
    });

    ["cpu","gpu"].forEach(id=>{
      $(id).addEventListener("change",handleOptionChange);
    });

    $("calculateBtn").addEventListener("click",run);

    function clamp(v,min,max){return Math.max(min,Math.min(max,v));}

    function estimate(){
      if ($("game").value === "" || $("cpu").value === "" || $("gpu").value === "" ||
          state.resolution === null || state.preset === null) return null;

      const game = UNIQUE_GAMES[Number($("game").value)];
      const cpu = CPUs[Number($("cpu").value)];
      const gpu = GPUS[Number($("gpu").value)];

      const rFactor = resolutionFactor[state.resolution];
      const pFactor = presetFactor[state.preset];

      const cpuPressure = clamp((game.cpu * 0.62 + (1-cpu.score/100) * 0.38) * 100,18,98);
      const gpuPressure = clamp((game.gpu * 0.68 + (1-gpu.score/100) * 0.32) * 100,18,99);

      const cpuFactor = Math.pow(cpu.score/100, .86);
      const gpuFactor = Math.pow(gpu.score/100, .92);

      const cpuPart = game.base * cpuFactor * (.55 + game.cpu*.72);
      const gpuPart = game.base * gpuFactor * (.55 + game.gpu*.72);

      let avg = Math.min(cpuPart,gpuPart) * rFactor * pFactor;

      if (state.rt){
        avg *= (0.74 + 0.18 * gpu.rt) / game.rt;
        avg = Math.max(avg,8);
      }

      if (state.upscaling){
        const uplift = state.resolution === 2160 ? 1.48 : state.resolution === 1440 ? 1.34 : 1.18;
        avg *= uplift;
      }

      const nativeAvg = avg;

      if (state.fg){
        const eligible = gpu.rt >= .68 && (gpu.score >= 34);
        if (eligible) avg *= 1.42;
      }

      avg = clamp(avg,8,1000);

      let lowRatio = .70;
      if (game.cpu > .72) lowRatio -= .05;
      if (game.gpu > .78) lowRatio -= .03;
      if (state.upscaling) lowRatio += .02;
      if (state.fg) lowRatio -= .02;

      const low = clamp(avg * lowRatio,5,avg*.88);

      let limit = "Balanced";
      const ratio = cpuPart / Math.max(gpuPart,.01);
      if (ratio < .88) limit = "GPU";
      else if (ratio > 1.14) limit = "CPU";

      const vramNeed = game.vram
        + (state.resolution === 2160 ? 3 : state.resolution === 1440 ? 1.5 : 0)
        + (state.preset === "ultra" ? 1.5 : state.preset === "high" ? .6 : 0)
        + (state.rt ? 1.5 : 0);

      const vramPct = clamp(vramNeed / gpu.vram * 100,10,120);

      let vramStatus = "Comfortable";
      if (vramPct >= 92) vramStatus = "Tight";
      else if (vramPct >= 78) vramStatus = "Watch VRAM";
      if (vramPct > 105) vramStatus = "Likely limit";

      /*
        SystemFit Score v2
        The old score was too heavily anchored to high-refresh 1080p targets,
        which made a perfectly playable 70–90 FPS AAA result look mediocre.
        This version uses resolution-aware targets and diminishing returns:
        FPS matters most, 1% lows matter next, and VRAM headroom is a smaller
        quality-of-life factor. High FPS still reaches 100, but AAA performance
        is judged against a more realistic target for the selected resolution.
      */
      const scoreTarget = state.resolution === 2160 ? 60 : state.resolution === 1440 ? 90 : 120;
      const lowTarget = scoreTarget * 0.62;

      // Keep Frame Generation from making the underlying render performance
      // look stronger than it is. The score is based on base FPS before FG.
      const fgEligible = gpu.rt >= .68 && gpu.score >= 34;
      const scoreAvg = state.fg && fgEligible ? nativeAvg : avg;
      const scoreLowValue = state.fg && fgEligible ? nativeAvg * lowRatio : low;

      // ~1.45x the target reaches the high-90s instead of 100 too early.
      const scoreFps = clamp(Math.pow(scoreAvg / (scoreTarget * 1.45), 0.55) * 65,0,65);
      const scoreLow = clamp(Math.pow(scoreLowValue / (lowTarget * 1.45), 0.55) * 25,0,25);

      let scoreVram = 10;
      if (vramPct > 105) scoreVram = 0;
      else if (vramPct > 92) scoreVram = 4;
      else if (vramPct > 78) scoreVram = 7;

      const score = Math.round(clamp(scoreFps + scoreLow + scoreVram,1,100));

      let title="Needs tuning", tag="BELOW TARGET";
      if (score >= 90){title="Excellent gaming headroom";tag="HIGH PERFORMANCE";}
      else if(score >= 78){title="Very strong gaming setup";tag="SMOOTH & FAST";}
      else if(score >= 65){title="Solid gaming performance";tag="PLAYABLE";}
      else if(score >= 48){title="Playable with some tuning";tag="TUNE SETTINGS";}

      let confidence = "Moderate";
      if (game.base >= 120 && game.gpu < .78 && game.cpu < .78) confidence = "Moderate-high";
      if (game.rt > 1.35 || game.cpu > .84 || game.gpu > .86) confidence = "Moderate";

      return {
        game,cpu,gpu,avg,low,limit,vramPct,vramStatus,score,title,tag,confidence,
        cpuPressure,gpuPressure,nativeAvg,fgEligible
      };
    }

    function fmtRange(value, spread=.10){
      const lo = Math.max(1,Math.round(value*(1-spread)));
      const hi = Math.max(lo+1,Math.round(value*(1+spread)));
      return `${lo}–${hi}`;
    }

    function updateCalculateButtonState(){
  const btn = document.getElementById('calculateBtn');
  if(!btn) return;
  const ready = !!(
    $("game").value !== "" &&
    $("cpu").value !== "" &&
    $("gpu").value !== "" &&
    state.resolution !== null &&
    state.preset !== null
  );
  btn.disabled = !ready;
  btn.setAttribute('aria-disabled', String(!ready));
}

function showSetupReadyState(){
  updateCalculateButtonState();
      const complete =
        $("game").value !== "" &&
        $("cpu").value !== "" &&
        $("gpu").value !== "" &&
        state.resolution !== null &&
        state.preset !== null;

      if (complete){
        $("resultGame").textContent = "Setup ready";
        $("score").textContent = "—";
        $("scoreRing").style.setProperty("--score",0);
        $("scoreTitle").textContent = "Ready to calculate";
        $("scoreText").textContent = "Your setup is complete. Press Calculate FPS to generate the estimate.";
        $("performanceTag").textContent = "PRESS CALCULATE FPS";
        $("avg").textContent = "—";
        $("low").textContent = "—";
        $("frameTime").textContent = "—";
        $("limit").textContent = "—";
        $("vram").textContent = "—";
        $("cpuPct").textContent = "—";
        $("gpuPct").textContent = "—";
        $("vramPct").textContent = "—";
        $("cpuBar").style.width = "0";
        $("gpuBar").style.width = "0";
        $("vramBar").style.width = "0";
        $("balanceText").textContent = "—";
        $("resultNote").textContent = "Setup complete. Press Calculate FPS when you are ready to generate the estimate.";
        $("fgBreakdown").hidden = true;
      } else {
        $("resultGame").textContent = "Choose your setup";
        $("score").textContent = "—";
        $("scoreRing").style.setProperty("--score",0);
        $("scoreTitle").textContent = "Ready to calculate";
        $("scoreText").textContent = "Select your game, CPU, GPU, resolution and graphics preset.";
        $("performanceTag").textContent = "WAITING FOR SETUP";
        $("avg").textContent = "—";
        $("low").textContent = "—";
        $("frameTime").textContent = "—";
        $("limit").textContent = "—";
        $("vram").textContent = "—";
        $("cpuPct").textContent = "—";
        $("gpuPct").textContent = "—";
        $("vramPct").textContent = "—";
        $("cpuBar").style.width = "0";
        $("gpuBar").style.width = "0";
        $("vramBar").style.width = "0";
        $("balanceText").textContent = "—";
        $("resultNote").textContent = "Choose your game, CPU, GPU, resolution and graphics preset. Results will appear after you press Calculate FPS.";
        $("fgBreakdown").hidden = true;
      }
    }

    function run(){
      const e = estimate();

      if (!e){
        $("resultGame").textContent = "Choose a game";
        $("score").textContent = "—";
        $("scoreRing").style.setProperty("--score",0);
        $("scoreTitle").textContent = "Ready to calculate";
        $("scoreText").textContent = "Select a game, CPU and GPU to generate your FPS estimate.";
        $("performanceTag").textContent = "WAITING FOR SETUP";
        $("avg").textContent = "—";
        $("low").textContent = "—";
        $("frameTime").textContent = "—";
        $("limit").textContent = "—";
        $("vram").textContent = "—";
        $("cpuPct").textContent = "—";
        $("gpuPct").textContent = "—";
        $("vramPct").textContent = "—";
        $("cpuBar").style.width = "0";
        $("gpuBar").style.width = "0";
        $("vramBar").style.width = "0";
        $("balanceText").textContent = "—";
        $("resultNote").textContent = "Choose your game, CPU, GPU, resolution and graphics preset. Results will appear after your full setup is selected.";
        $("fgBreakdown").hidden = true;
        return;
      }

      hasCalculated = true;

      $("resultGame").textContent =
        `${e.game.name} · ${state.resolution === 2160 ? "4K" : state.resolution+"p"} · ${state.preset[0].toUpperCase()+state.preset.slice(1)}`;

      $("score").textContent = e.score;
      $("scoreRing").style.setProperty("--score",e.score);
      $("scoreTitle").textContent = e.title;
      $("scoreText").textContent =
        `Model score based on base rendering performance, 1% low behaviour and VRAM headroom. Confidence: ${e.confidence}.`;
      $("performanceTag").textContent = e.tag;

      $("avg").textContent = fmtRange(e.avg,.11);
      $("low").textContent = fmtRange(e.low,.13);
      $("frameTime").textContent = `${(1000/e.avg).toFixed(1)} ms`;

      if (state.fg){
        $("fgBreakdown").hidden = false;
        $("fgBase").textContent = fmtRange(e.nativeAvg,.11);
        $("fgOutput").textContent = fmtRange(e.avg,.11);
        $("fgBreakdownStatus").textContent = e.fgEligible ? "MODELED" : "NOT APPLIED";
      } else {
        $("fgBreakdown").hidden = true;
      }
      $("limit").textContent = e.limit;
      $("vram").textContent = e.vramStatus;

      $("cpuPct").textContent = Math.round(e.cpuPressure)+"%";
      $("gpuPct").textContent = Math.round(e.gpuPressure)+"%";
      $("vramPct").textContent = Math.round(e.vramPct)+"%";
      $("cpuBar").style.width = clamp(e.cpuPressure,0,100)+"%";
      $("gpuBar").style.width = clamp(e.gpuPressure,0,100)+"%";
      $("vramBar").style.width = clamp(e.vramPct,0,100)+"%";

      $("balanceText").textContent = e.limit === "Balanced"
        ? "Good balance"
        : `${e.limit}-limited`;

      let note = `Modelled estimate with ${e.confidence.toLowerCase()} confidence.`;
      if (state.fg && !(e.gpu.rt >= .68 && e.gpu.score >= 34))
        note += " Frame generation was selected, but this GPU may not support the modeled feature reliably.";
      if (e.vramPct > 100)
        note += " Estimated VRAM demand exceeds the selected GPU capacity; expect stutter or settings compromises.";
      note += " Actual FPS varies with patches, drivers, temperatures, background load and exact game settings.";
      $("resultNote").textContent = note;
    }

    const gameList = $("gameList");
    const librarySearch = $("librarySearch");
    const LIBRARY_PAGE_SIZE = 24;
    let libraryPage = 1;

    function renderLibrary(){
      const q = librarySearch.value.trim().toLowerCase();
      const cat = state.category;
      const filtered = UNIQUE_GAMES.filter(g=>{
        const matchSearch = !q || g.name.toLowerCase().includes(q);
        const matchCat = cat === "All" || g.cat === cat;
        return matchSearch && matchCat;
      });

      const totalPages = Math.max(1,Math.ceil(filtered.length/LIBRARY_PAGE_SIZE));
      libraryPage = Math.min(libraryPage,totalPages);
      const start = (libraryPage-1)*LIBRARY_PAGE_SIZE;
      const list = filtered.slice(start,start+LIBRARY_PAGE_SIZE);

      $("libraryCount").textContent = filtered.length;
      $("pageStatus").textContent = `Page ${libraryPage} of ${totalPages}`;
      $("prevPage").disabled = libraryPage <= 1;
      $("nextPage").disabled = libraryPage >= totalPages;
      gameList.innerHTML = "";

      if (!list.length){
        gameList.innerHTML = '<div class="empty">No games match that search.</div>';
        return;
      }

      list.forEach(g=>{
        const btn = document.createElement("button");
        btn.className = "game-card";
        btn.type = "button";
        btn.innerHTML = `<b>${g.name}</b><small>${g.cat} · ${g.vram} GB profile</small>`;
        btn.addEventListener("click",()=>{
          $("game").value = String(UNIQUE_GAMES.indexOf(g));
          $("selectedGameLabel").textContent = g.name;
          closeGamePicker();
          handleOptionChange();
          window.scrollTo({top:document.querySelector(".calculator").offsetTop-20,behavior:"smooth"});
        });
        gameList.appendChild(btn);
      });
    }

    $("prevPage").addEventListener("click",()=>{
      if(libraryPage > 1){
        libraryPage--;
        renderLibrary();
        document.querySelector(".library").scrollIntoView({behavior:"smooth",block:"start"});
      }
    });

    $("nextPage").addEventListener("click",()=>{
      const q = librarySearch.value.trim().toLowerCase();
      const cat = state.category;
      const count = UNIQUE_GAMES.filter(g=>{
        const matchSearch = !q || g.name.toLowerCase().includes(q);
        const matchCat = cat === "All" || g.cat === cat;
        return matchSearch && matchCat;
      }).length;
      const totalPages = Math.max(1,Math.ceil(count/LIBRARY_PAGE_SIZE));
      if(libraryPage < totalPages){
        libraryPage++;
        renderLibrary();
        document.querySelector(".library").scrollIntoView({behavior:"smooth",block:"start"});
      }
    });

    document.querySelectorAll("#categoryTabs .category").forEach(btn=>{
      btn.addEventListener("click",()=>{
        document.querySelectorAll("#categoryTabs .category").forEach(x=>x.classList.remove("active"));
        btn.classList.add("active");
        state.category = btn.dataset.category;
        libraryPage = 1;
        renderLibrary();
      });
    });

    librarySearch.addEventListener("input",()=>{
      libraryPage = 1;
      renderLibrary();
    });

    $("heroGameCount").textContent = UNIQUE_GAMES.length + "+";
    populateGameSelect();
    renderGamePicker();
    renderLibrary();
    showSetupReadyState();
  </script>

  <script src="header.js" defer></script>
</body>
</html>
