name: Patch bottleneck model
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: startsWith(github.event.head_commit.message, 'PATCH_BOTTLENECK_MODEL')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace scoring model only
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('bottleneck.html')
          s = p.read_text(encoding='utf-8')
          new = '''function modelScenario(cpuScore,gpuScore,resolution,gameType,target){
            const demand=gameDemand(gameType);
            const targetFactor=Math.pow(target/60,0.72);
            const cpuLoad=(100*targetFactor*demand.cpu)/Math.max(cpuScore,1);
            const gpuLoad=(100*targetFactor*demand.gpu*resolutionGpuMultiplier(resolution))/Math.max(gpuScore,1);
            const cpuSafe=Math.max(cpuLoad,0.01),gpuSafe=Math.max(gpuLoad,0.01);
            const ratio=cpuSafe/gpuSafe;
            const limiting=ratio>1.25?"CPU":ratio<0.80?"GPU":"Balanced";
            const balance=clamp(100-Math.abs(Math.log(ratio))*45);
            const overload=Math.max(cpuLoad,gpuLoad);
            return {cpuLoad,gpuLoad,balance,limiting,overload};
          }'''
          pattern = r'function modelScenario\(cpuScore,gpuScore,resolution,gameType,target\)\{.*?\n\}\n\nfunction setVendorAccent'
          s2, n = re.subn(pattern, new + '\n\nfunction setVendorAccent', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Expected modelScenario block was not found exactly once; no change made.')
          p.write_text(s2, encoding='utf-8')
      - name: Commit patched model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bottleneck.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix bottleneck scenario scoring model"
          git push origin main
