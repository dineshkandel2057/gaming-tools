name: Calibrate bottleneck model
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!startsWith(github.event.head_commit.message, 'Calibrate bottleneck scenario model')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scoring calibration only
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('bottleneck.html'); s=p.read_text(encoding='utf-8')
          new='''function modelScenario(cpuScore,gpuScore,resolution,gameType,target){
  const demand=gameDemand(gameType);
  const BASELINE_DEMAND=42;
  const targetFactor=Math.pow(target/60,0.72);
  const cpuLoad=(BASELINE_DEMAND*targetFactor*demand.cpu*100)/Math.max(cpuScore,1);
  const gpuLoad=(BASELINE_DEMAND*targetFactor*demand.gpu*resolutionGpuMultiplier(resolution)*100)/Math.max(gpuScore,1);
  const ratio=Math.max(cpuLoad,0.01)/Math.max(gpuLoad,0.01);
  const limiting=ratio>1.25?"CPU":ratio<0.80?"GPU":"Balanced";
  const balance=clamp(100-Math.abs(Math.log(ratio))*45);
  const overload=Math.max(cpuLoad,gpuLoad);
  return {cpuLoad,gpuLoad,balance,limiting,overload};
}'''
          pat=r'function modelScenario\(cpuScore,gpuScore,resolution,gameType,target\)\{.*?\n\}\n\nfunction setVendorAccent'
          s,n=re.subn(pat,new+'\n\nfunction setVendorAccent',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Scoring block not found exactly once')
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bottleneck.html
          git commit -m "Calibrate bottleneck scenario model"
          git push origin main
