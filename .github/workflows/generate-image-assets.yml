name: Generate SystemFit image assets

on:
  push:
    paths:
      - ".github/workflows/generate-image-assets.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate assets
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          convert systemfit-favicon.png -resize 48x48 -strip systemfit-favicon-48.png
          convert systemfit-favicon.png -resize 192x192 -strip favicon-192.png
          convert systemfit-favicon.png -resize 180x180 -strip apple-touch-icon.png
          convert -size 1200x630 xc:"#070A18" \
            \( systemfit-favicon.png -resize 360x360 \) -geometry +105+135 -composite \
            -fill "#0A0F22" -draw "roundrectangle 54,54 1146,576 24,24" \
            -font DejaVu-Sans-Bold -pointsize 64 -fill "#F5F7FF" -annotate +570+235 "SYSTEMFIT PC" \
            -font DejaVu-Sans -pointsize 30 -fill "#5FDCFF" -annotate +570+305 "Practical PC Tools & Guides" \
            -pointsize 22 -fill "#DCE1F0" -annotate +570+365 "PC Build Planner  •  FPS Calculator" \
            -annotate +570+405 "GPU Comparison  •  Bottleneck Calculator" \
            -strip og-default.png
          rm -f .github/workflows/generate-image-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systemfit-favicon-48.png favicon-192.png apple-touch-icon.png og-default.png .github/workflows/generate-image-assets.yml
          git commit -m "Generate resized image assets"
          git push
